name: Deploy website to GitHub Pages (public)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-public
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Restore public image assets
        run: |
          mkdir -p public
          for asset in bar-night.png entrance-night.png gorilla-logo.png lounge-hero.png og.png favicon.svg; do
            curl -fsSL "https://endstation-alter-bahnhof.nxco-nbg.chatgpt.site/$asset" -o "public/$asset"
          done
      - name: Build
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
